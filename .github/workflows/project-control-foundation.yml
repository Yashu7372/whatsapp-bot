name: Project Control Foundation

on:
  push:
    branches:
      - feature/project-control-modulith-foundation
    paths:
      - 'project-control-service/**'
      - 'docker-compose.project-control.yml'
      - '.env.project-control.example'
      - 'docs/PROJECT_CONTROL_LOCAL_CLOUDFLARE.md'
      - '.github/workflows/project-control-foundation.yml'
  pull_request:
    paths:
      - 'project-control-service/**'
      - 'docker-compose.project-control.yml'
      - '.env.project-control.example'
      - 'docs/PROJECT_CONTROL_LOCAL_CLOUDFLARE.md'
      - '.github/workflows/project-control-foundation.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: project_control_test
          POSTGRES_USER: project_control
          POSTGRES_PASSWORD: project_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project_control -d project_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/project_control_test
      TEST_DB_USERNAME: project_control
      TEST_DB_PASSWORD: project_control
    defaults:
      run:
        working-directory: project-control-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify foundation
        run: |
          set -o pipefail
          mvn -B clean verify 2>&1 | tee ../project-control-maven.log
      - name: Build Java 21 container
        if: success()
        run: docker build -t project-control-backend:ci .
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-control-foundation-evidence
          if-no-files-found: ignore
          path: project-control-maven.log
