name: portfolio-validation

on:
  push:
    branches:
      - 'series/ecp-*'
      - 'feature/portfolio-content-studio'
  pull_request:
    paths:
      - 'portfolio/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test portfolio validation engine
        run: python -m unittest discover -s portfolio/engine -p 'test_*.py'
      - name: Validate committed article artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(portfolio/articles/ECP-*)
          test ${#dirs[@]} -gt 0 || { echo "No article workspaces found"; exit 1; }
          for d in "${dirs[@]}"; do
            if [[ -f "$d/article-model.json" ]]; then
              echo "Validating $d"
              python portfolio/engine/studio.py validate "$d"
            else
              echo "Skipping $d: regenerate with the structured pipeline before it can be publication-validated"
            fi
          done
      - name: Upload portfolio artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-generated
          path: |
            portfolio/articles/ECP-*/article-model.json
            portfolio/articles/ECP-*/engineering-analysis.json
            portfolio/articles/ECP-*/article.md
            portfolio/articles/ECP-*/linkedin.md
            portfolio/articles/ECP-*/visual-model.json
            portfolio/articles/ECP-*/visual.html
            portfolio/articles/ECP-*/source-pack.json
            portfolio/articles/ECP-*/validation.json
