name: Backend CI

on:
  pull_request:
    branches: [develop, main, feature/enterprise-document-control]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Java 21 + Postgres verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: whatsapp_bot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d whatsapp_bot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/whatsapp_bot
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      WHATSAPP_VERIFY_TOKEN: ci-verify-token
      WHATSAPP_ACCESS_TOKEN: ci-access-token
      WHATSAPP_MOCK_SEND_ENABLED: "true"
      AI_PROVIDER: GEMINI
      AI_GEMINI_API_KEY: ""
      KNOWLEDGE_REBUILD_ON_STARTUP: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Flyway, Hibernate and tests
        run: mvn -B -ntp clean verify
