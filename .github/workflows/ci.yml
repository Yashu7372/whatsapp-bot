name: CI

on:
  push:
    branches:
      - develop
      - 'agent/**'
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and test Spring Boot
        run: mvn -B test

      - name: Validate renderer Python
        run: python -m py_compile renderer/app.py

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
