spring:
  application:
    name: whatsapp-bot-phase1

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

whatsapp:
  verify-token: ${WHATSAPP_VERIFY_TOKEN}
  graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v19.0}
  fallback-access-token: ${WHATSAPP_ACCESS_TOKEN}
  mock-send-enabled: ${WHATSAPP_MOCK_SEND_ENABLED:false}

# ─── Pluggable AI provider config ──────────────────────────────────────────
# Switch providers by changing AI_PROVIDER (+ that provider's own env vars)
# and restarting the process/container. No code change, no rebuild.
# Supported values: GEMINI, OLLAMA, OPENAI, ANTHROPIC.
ai:
  provider: ${AI_PROVIDER:GEMINI}
  temperature: ${AI_TEMPERATURE:0.0}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
  memory-max-messages: ${AI_MEMORY_MAX_MESSAGES:20}

  gemini:
    api-key: ${AI_GEMINI_API_KEY:}
    model-name: ${AI_GEMINI_MODEL:gemini-2.5-flash}

  ollama:
    base-url: ${AI_OLLAMA_BASE_URL:http://localhost:11434}
    model-name: ${AI_OLLAMA_MODEL:llama3.1:8b}

  openai:
    api-key: ${AI_OPENAI_API_KEY:}
    model-name: ${AI_OPENAI_MODEL:gpt-4o-mini}

  anthropic:
    api-key: ${AI_ANTHROPIC_API_KEY:}
    model-name: ${AI_ANTHROPIC_MODEL:claude-sonnet-4-5}

logging:
  level:
    com.whatsappbot: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN

app:
  knowledge:
    rebuild-on-startup: ${KNOWLEDGE_REBUILD_ON_STARTUP:false}
  webhook:
    outbox:
      poll-interval-ms: ${WEBHOOK_OUTBOX_POLL_INTERVAL_MS:1000}
      batch-size: ${WEBHOOK_OUTBOX_BATCH_SIZE:5}
      max-retries: ${WEBHOOK_OUTBOX_MAX_RETRIES:3}
      stuck-recovery-minutes: ${WEBHOOK_OUTBOX_STUCK_RECOVERY_MINUTES:10}
  publishing:
    scheduler:
      interval-ms: ${PUBLISHING_SCHEDULER_INTERVAL_MS:30000}

