# Document control notification copy.
#
# Placeholders, in order, for every document.notification.* entry:
#   {0} document code or title   {1} workflow stage name   {2} due timestamp
#   {3} approval status          {4} review outcome        {5} transmittal number
#   {6} subject                  {7} issue purpose
#
# Note for editors: this file is read by MessageFormat, so a literal apostrophe must be doubled ('')
# and literal braces must be quoted. Keeping the copy apostrophe-free avoids the trap entirely.

document.notification.label.document=Document
document.notification.label.stage=approval stage

document.notification.approval_assigned.subject=Approval action assigned
document.notification.approval_assigned.body={0} requires your action at {1}. Due: {2}.

document.notification.approval_due_soon.subject=Approval due soon
document.notification.approval_due_soon.body={0} is due soon at {1}. Due: {2}.

document.notification.approval_overdue.subject=Approval overdue
document.notification.approval_overdue.body={0} is overdue at {1}. Due: {2}.

document.notification.approval_result.subject=Approval result: {3}
document.notification.approval_result.body={0} completed its workflow with status {3}. Review outcome: {4}.

document.notification.transmittal_issued.subject=Transmittal issued: {5}
document.notification.transmittal_issued.body={6} was issued to your organization for {7}.

document.notification.transmittal_acknowledged.subject=Transmittal acknowledged: {5}
document.notification.transmittal_acknowledged.body=A recipient organization acknowledged transmittal {5}. Subject: {6}.

document.notification.default.subject=Document control notification
document.notification.default.body={0}: {1}
