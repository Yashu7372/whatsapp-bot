# src/main/resources/application-prod.yml
# Active when SPRING_PROFILES_ACTIVE=prod (set in Cloud Run env var)
# All sensitive values are injected via Secret Manager secrets mounted as env vars.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false

server:
  port: ${PORT:8080}   # Cloud Run injects $PORT

whatsapp:
  verify-token: ${WHATSAPP_VERIFY_TOKEN}
  graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v19.0}
  fallback-access-token: ${WHATSAPP_ACCESS_TOKEN}
  mock-send-enabled: false

# ─── AI provider — production default is Gemini's direct API ────────────────
# NOTE: this replaced Vertex AI (gemini.project/gemini.location, which
# required GCP Application Default Credentials). GEMINI_API_KEY is now
# injected via Secret Manager the same way the other secrets are (see
# cloudbuild.yaml / deploy/setup-gcp.sh, which already provision it).
ai:
  provider: ${AI_PROVIDER:GEMINI}
  temperature: ${AI_TEMPERATURE:0.0}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
  memory-max-messages: ${AI_MEMORY_MAX_MESSAGES:20}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model-name: ${GEMINI_MODEL:gemini-2.5-flash}

  ollama:
    base-url: ${AI_OLLAMA_BASE_URL:}
    model-name: ${AI_OLLAMA_MODEL:llama3.1:8b}

  openai:
    api-key: ${AI_OPENAI_API_KEY:}
    model-name: ${AI_OPENAI_MODEL:gpt-4o-mini}

  anthropic:
    api-key: ${AI_ANTHROPIC_API_KEY:}
    model-name: ${AI_ANTHROPIC_MODEL:claude-sonnet-4-5}

logging:
  level:
    com.whatsappbot: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  knowledge:
    rebuild-on-startup: false