# Active when SPRING_PROFILES_ACTIVE=local (set in docker-compose.yml / .env)
# This profile uses Docker Postgres, local Ollama, local file storage and the
# template renderer. No GCP credentials are required.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/whatsapp_bot}
    username: ${DB_USERNAME:whatsapp_bot}
    password: ${DB_PASSWORD:whatsapp_bot}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: false

  servlet:
    multipart:
      enabled: true
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:50MB}

server:
  port: ${SERVER_PORT:8080}

whatsapp:
  verify-token: ${WHATSAPP_VERIFY_TOKEN}
  graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v19.0}
  fallback-access-token: ${WHATSAPP_ACCESS_TOKEN}
  mock-send-enabled: ${WHATSAPP_MOCK_SEND_ENABLED:false}

# Local default: Gemma 4 through Ollama. Docker Compose overrides these values
# explicitly so the application and Ollama always use the same model.
ai:
  provider: ${AI_PROVIDER:OLLAMA}
  temperature: ${AI_TEMPERATURE:0.0}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:180}
  memory-max-messages: ${AI_MEMORY_MAX_MESSAGES:20}

  gemini:
    api-key: ${AI_GEMINI_API_KEY:}
    model-name: ${AI_GEMINI_MODEL:gemini-2.5-flash}

  ollama:
    base-url: ${AI_OLLAMA_BASE_URL:http://ollama:11434}
    model-name: ${AI_OLLAMA_MODEL:gemma4:e2b}

  openai:
    api-key: ${AI_OPENAI_API_KEY:}
    model-name: ${AI_OPENAI_MODEL:gpt-4o-mini}

  anthropic:
    api-key: ${AI_ANTHROPIC_API_KEY:}
    model-name: ${AI_ANTHROPIC_MODEL:claude-sonnet-4-5}

logging:
  level:
    com.whatsappbot: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
    dev.langchain4j: INFO

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  knowledge:
    rebuild-on-startup: ${KNOWLEDGE_REBUILD_ON_STARTUP:false}
  jwt:
    secret: ${JWT_SECRET:this-is-a-local-dev-secret-change-in-production-min32chars}
    access-expiry-seconds: ${JWT_ACCESS_EXPIRY_SECONDS:3600}
    refresh-expiry-seconds: ${JWT_REFRESH_EXPIRY_SECONDS:604800}
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:./local-uploads}
  reels:
    renderer-base-url: ${REEL_RENDERER_BASE_URL:http://renderer:8090}
    poll-interval-ms: ${REEL_RENDER_POLL_INTERVAL_MS:2000}
    render-timeout-seconds: ${REEL_RENDER_TIMEOUT_SECONDS:240}
    max-asset-bytes: ${REEL_MAX_ASSET_BYTES:10485760}
    default-template: ${REEL_DEFAULT_TEMPLATE:DYNAMIC_BOLD}
    default-voice: ${REEL_DEFAULT_VOICE:af_heart}
  stock-media:
    pexels-api-key: ${PEXELS_API_KEY:}
    pixabay-api-key: ${PIXABAY_API_KEY:}
  trends:
    youtube-api-key: ${YOUTUBE_API_KEY:}
    google-rss-enabled: ${GOOGLE_TRENDS_RSS_ENABLED:true}
