services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: whatsapp-bot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_bot}
      POSTGRES_USER: ${POSTGRES_USER:-whatsapp_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatsapp_bot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - whatsapp_bot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatsapp_bot} -d ${POSTGRES_DB:-whatsapp_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp_bot_net

  # Optional fully-local model runtime. Only needed if AI_PROVIDER=OLLAMA.
  # Pull a model once with: docker compose exec ollama ollama pull llama3.1:8b
  ollama:
    image: ollama/ollama:latest
    container_name: whatsapp-bot-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - whatsapp_bot_ollama_data:/root/.ollama
    networks:
      - whatsapp_bot_net
    profiles:
      - ollama

  # Renderer worker — all video/image heavy lifting runs here, never in the main app.
  renderer:
    build:
      context: ./renderer
      dockerfile: Dockerfile
    container_name: whatsapp-bot-renderer
    environment:
      RENDER_ROOT: /data/renders
      STORAGE_ROOT: /data/storage
      CHARACTER_PACK_ROOT: /data/character_pack
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      KOKORO_LANG_CODE: ${KOKORO_LANG_CODE:-a}
      KOKORO_DEFAULT_VOICE: ${KOKORO_DEFAULT_VOICE:-af_heart}
      VOICE_BHAIYA: ${VOICE_BHAIYA:-am_liam}
      VOICE_CHITTI: ${VOICE_CHITTI:-af_heart}
      MAX_RENDER_SECONDS: ${MAX_RENDER_SECONDS:-90}
      LOG_LEVEL: ${RENDERER_LOG_LEVEL:-INFO}
    ports:
      - "${RENDERER_PORT:-8090}:8090"
    volumes:
      - whatsapp_bot_storage:/data/storage:ro
      - whatsapp_bot_renders:/data/renders
      - whatsapp_bot_character_pack:/data/character_pack
      - whatsapp_bot_kokoro_cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - whatsapp_bot_net
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-bot-app
    depends_on:
      postgres:
        condition: service_healthy
      renderer:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-whatsapp_bot}
      DB_USERNAME: ${POSTGRES_USER:-whatsapp_bot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-whatsapp_bot}
      SERVER_PORT: 8080
      VIDEO_RENDERER_BASE_URL: http://renderer:8090
      VIDEO_RENDER_OUTPUT_DIR: /data/renders
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - whatsapp_bot_renders:/data/renders
    networks:
      - whatsapp_bot_net
    restart: unless-stopped

networks:
  whatsapp_bot_net:
    driver: bridge

volumes:
  whatsapp_bot_pgdata:
  whatsapp_bot_ollama_data:
  whatsapp_bot_storage:
  whatsapp_bot_renders:
  whatsapp_bot_character_pack:
  whatsapp_bot_kokoro_cache: