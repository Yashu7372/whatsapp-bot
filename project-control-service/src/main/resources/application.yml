spring:
  application:
    name: project-control-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/project_control}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
