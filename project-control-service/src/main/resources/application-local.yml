spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./project-control-local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

project-control:
  demo:
    enabled: ${PROJECT_CONTROL_DEMO_ENABLED:true}

server:
  port: ${PORT:8080}
