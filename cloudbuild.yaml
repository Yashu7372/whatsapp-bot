# cloudbuild.yaml
# Triggered on push to main branch.
# Builds the Docker image, pushes to Artifact Registry, and deploys to Cloud Run.

substitutions:
  _REGION: me-central1          # Change to your preferred GCP region
  _SERVICE_NAME: whatsapp-bot
  _REPO_NAME: whatsapp-bot-repo # Artifact Registry repository name
  _DB_INSTANCE: whatsapp-bot-db # Cloud SQL instance name (connection name suffix)

steps:
  # ── 1. Run unit tests ──────────────────────────────────────────────────────
  - name: "maven:3.9.6-eclipse-temurin-21"
    id: test
    entrypoint: mvn
    args: ["test", "-q"]

  # ── 2. Build Docker image ──────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build-image
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$COMMIT_SHA"
      - -t
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest"
      - .
    waitFor: [test]

  # ── 3. Push to Artifact Registry ──────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: push-image
    args:
      - push
      - --all-tags
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}"
    waitFor: [build-image]

  # ── 4. Deploy to Cloud Run ─────────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated           # Meta webhook needs to reach this publicly
      - --min-instances=1                 # Keep 1 warm to avoid cold-start webhook drops
      - --max-instances=10
      - --memory=1Gi
      - --cpu=1
      - --concurrency=80
      - --timeout=60s
      - --set-env-vars=SPRING_PROFILES_ACTIVE=prod
      - --set-secrets=DB_URL=DB_URL:latest,DB_USERNAME=DB_USERNAME:latest,DB_PASSWORD=DB_PASSWORD:latest,WHATSAPP_VERIFY_TOKEN=WHATSAPP_VERIFY_TOKEN:latest,WHATSAPP_ACCESS_TOKEN=WHATSAPP_ACCESS_TOKEN:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest
      - --service-account=whatsapp-bot-sa@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_DB_INSTANCE}
    waitFor: [push-image]

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$COMMIT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
