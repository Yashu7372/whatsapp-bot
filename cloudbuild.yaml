steps:
  - name: "gcr.io/cloud-builders/docker"
    id: build-image
    args:
      - build
      - -t
      - "me-central1-docker.pkg.dev/$PROJECT_ID/whatsapp-bot-repo/whatsapp-bot:$COMMIT_SHA"
      - -t
      - "me-central1-docker.pkg.dev/$PROJECT_ID/whatsapp-bot-repo/whatsapp-bot:latest"
      - .
  - name: "gcr.io/cloud-builders/docker"
    id: push-image
    args:
      - push
      - --all-tags
      - "me-central1-docker.pkg.dev/$PROJECT_ID/whatsapp-bot-repo/whatsapp-bot"
    waitFor: [ build-image ]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - whatsapp-bot
      - --image=me-central1-docker.pkg.dev/$PROJECT_ID/whatsapp-bot-repo/whatsapp-bot:$COMMIT_SHA
      - --region=me-central1
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=5
      - --memory=1Gi
      - --cpu=1
      - --set-env-vars=SPRING_PROFILES_ACTIVE=prod,GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=me-central1,GEMINI_MODEL=gemini-2.5-flash
      - --set-secrets=DB_URL=DB_URL:latest,DB_USERNAME=DB_USERNAME:latest,DB_PASSWORD=DB_PASSWORD:latest,WHATSAPP_VERIFY_TOKEN=WHATSAPP_VERIFY_TOKEN:latest,WHATSAPP_ACCESS_TOKEN=WHATSAPP_ACCESS_TOKEN:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest
      - --service-account=whatsapp-bot-sa@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:me-central1:whatsapp-bot-db
    waitFor: [ push-image ]
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8